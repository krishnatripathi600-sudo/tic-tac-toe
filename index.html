<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>

        <!-- Game Mode -->

        <div class="mode">

            <label><b>Game Mode :</b></label>

            <select id="gameMode">

                <option value="ai">

                    Player vs Computer

                </option>

                <option value="player">

                    Player vs Player

                </option>

            </select>

        </div>

        <p id="status">

            Your Turn (X)

        </p>

        <div id="board">

        </div>

        <button id="restartBtn">

            Restart Game

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
